name: Auto Update Mr Universe
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to click "Run Now" manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: |
          pip install feedparser groq jinja2

      - name: Run AI Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "MrUniverseBot"
          git config --global user.email "bot@mruniverse.com"
          git add index.html
          git commit -m "🚀 Auto-updated viral news" || echo "No changes to commit"
          git push
