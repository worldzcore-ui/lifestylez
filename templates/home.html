{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        {% for story in stories %}
        <div class="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden hover:border-pink-500/50 transition-all group">
            <a href="articles/{{ story.filename }}">
                <div class="relative h-48 overflow-hidden">
                    <img src="https://image.pollinations.ai/prompt/{{ story.title }} dark moody?width=400&height=300&nologo=true" 
                         class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-bold mb-2 group-hover:text-pink-500 transition-colors">{{ story.title }}</h2>
                    <p class="text-sm text-gray-400 line-clamp-2">{{ story.intro }}</p>
                    <span class="text-xs text-gray-500 mt-4 block">Read Article →</span>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
