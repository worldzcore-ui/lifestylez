<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LIFESTYLEZ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #ffffff; }
        .glass-nav { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #222; }
        .nav-link { color: #888; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .nav-link:hover { color: #fff; text-shadow: 0 0 10px #ff2e63; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="text-2xl font-bold tracking-tighter">LIFE<span class="text-pink-500">STYLEZ</span></a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link">Viral</a>
                    <a href="news.html" class="nav-link">News</a>
                    <a href="games.html" class="nav-link text-yellow-400">Games</a>
                    <a href="about.html" class="nav-link">About</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-20 flex-grow">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-black border-t border-gray-900 py-8 mt-12 text-center text-gray-600 text-xs">
        <p>&copy; 2024 Lifestylez. <a href="privacy.html" class="hover:text-white">Privacy Policy</a></p>
    </footer>

</body>
</html>
