<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LIFESTYLEZ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: #ffffff; }
        .glass-nav { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #222; }
        .nav-link { color: #888; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .nav-link:hover { color: #fff; text-shadow: 0 0 10px #ff2e63; }
        .active-link { color: #ff2e63; text-shadow: 0 0 10px #ff2e63; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="{{ path }}index.html" class="text-2xl font-bold tracking-tighter">
                    LIFE<span class="text-pink-500">STYLEZ</span>
                </a>
                
                <div class="hidden md:flex space-x-8">
                    <a href="{{ path }}index.html" class="nav-link {% if active_page == 'home' %}active-link{% endif %}">Viral</a>
                    <a href="{{ path }}news.html" class="nav-link {% if active_page == 'news' %}active-link{% endif %}">News</a>
                    <a href="{{ path }}games.html" class="nav-link text-yellow-400 {% if active_page == 'games' %}active-link{% endif %}">Games 🎮</a>
                    <a href="{{ path }}about.html" class="nav-link {% if active_page == 'about' %}active-link{% endif %}">About</a>
                </div>

                <div class="md:hidden">
                    <a href="{{ path }}games.html" class="text-yellow-400 font-bold">PLAY 🎮</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-20 flex-grow">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-black border-t border-gray-900 py-10 mt-12">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 text-sm text-gray-600">
            <div>
                <h3 class="text-white font-bold mb-4">LIFESTYLEZ</h3>
                <p>Automated viral trends and gaming content.</p>
            </div>
            <div>
                <h3 class="text-white font-bold mb-4">Links</h3>
                <ul class="space-y-2">
                    <li><a href="{{ path }}privacy.html" class="hover:text-pink-500">Privacy Policy</a></li>
                    <li><a href="{{ path }}about.html" class="hover:text-pink-500">About Us</a></li>
                </ul>
            </div>
            <div>
                <p>&copy; 2024 Lifestylez Media.</p>
            </div>
        </div>
    </footer>

</body>
</html>
