<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Universe | Trending Lifestyle & Gossip</title>
    <style>
        :root {
            --primary: #ff0055; /* Viral Red */
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }
        body {
            font-family: 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(90deg, #ff0055, #ff5e00);
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .update-time {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-content {
            padding: 20px;
        }
        .tag {
            background-color: var(--primary);
            color: white;
            padding: 4px 8px;
            text-transform: uppercase;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }
        h2 {
            margin: 10px 0;
            font-size: 1.5rem;
            line-height: 1.3;
        }
        p {
            color: #ccc;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            border-radius: 0 0 12px 12px;
        }
        .btn:hover {
            background-color: #d40047;
        }
    </style>
</head>
<body>

<header>
    Mr Universe 🚀
</header>

<div class="container">
    <div class="update-time">
        Latest Viral Updates: {{ last_updated }}
    </div>

    {% for story in stories %}
    <div class="card">
        <div class="card-content">
            <span class="tag">Trending Now</span>
            <h2>{{ story.title }}</h2>
            <p>{{ story.body }}</p>
        </div>
        <a href="https://omg10.com/4/10565898" target="_blank" class="btn">
            🔥 Reveal Full Story
        </a>
    </div>
    {% endfor %}

</div>

</body>
</html>
