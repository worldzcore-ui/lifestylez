<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFESTYLEZ | Exclusive Trends</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        'neon-pink': '#ff2e63',
                        'neon-blue': '#08d9d6',
                        'glass-bg': 'rgba(255, 255, 255, 0.05)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)',
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0f0f;
            /* Animated Deep Mesh Gradient */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(8, 217, 214, 0.2);
            transform: translateY(-5px);
        }
        
        /* Smooth Scroll */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="antialiased overflow-x-hidden selection:bg-neon-pink selection:text-white">

    <nav class="fixed w-full z-50 top-0 start-0 border-b border-glass-border bg-black/50 backdrop-blur-lg">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse">
                <span class="self-center text-3xl font-bold whitespace-nowrap tracking-tighter">
                    LIFE<span class="text-neon-pink">STYLEZ</span>
                </span>
            </a>
            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <button type="button" class="text-white bg-gradient-to-r from-neon-pink to-purple-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-pink-300/50 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 shadow-lg shadow-pink-500/50">
                    Subscribe
                </button>
            </div>
        </div>
    </nav>

    <div class="relative pt-32 pb-12 sm:pt-40 sm:pb-16 text-center">
        <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-200 via-white to-pink-200 sm:text-7xl mb-4 drop-shadow-2xl">
            Trending <span class="italic font-light">Now</span>
        </h1>
        <p class="mt-4 text-lg text-gray-400 max-w-2xl mx-auto">
            Live updates on Viral Gossip, Tech, and Lifestyle from the USA & UK.
            <br>
            <span class="text-xs font-mono text-neon-blue animate-pulse">
                LAST UPDATED: {{ last_updated }}
            </span>
        </p>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            {% for story in stories %}
            <div class="glass-card rounded-2xl p-6 transition-all duration-300 flex flex-col justify-between h-full group">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-blue-900/30 text-blue-300 text-xs font-bold px-2.5 py-0.5 rounded border border-blue-800">
                            VIRAL
                        </span>
                        <span class="text-gray-500 text-xs">Just now</span>
                    </div>

                    <h2 class="text-2xl font-bold mb-3 text-white leading-tight group-hover:text-neon-blue transition-colors">
                        {{ story.title }}
                    </h2>

                    <p class="text-gray-400 text-sm mb-6 leading-relaxed">
                        {{ story.body }}
                    </p>
                </div>

                <div class="mt-auto">
                    <a href="https://omg10.com/4/10565898" target="_blank" class="relative inline-flex items-center justify-center w-full p-0.5 mb-2 me-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800">
                        <span class="relative w-full text-center px-5 py-3.5 transition-all ease-in duration-75 bg-gray-900 rounded-md group-hover:bg-opacity-0 font-bold tracking-widest uppercase">
                            🔥 Reveal Story
                        </span>
                    </a>
                    <p class="text-[10px] text-center text-gray-600 mt-2 uppercase tracking-widest">
                        Ad-Supported Content
                    </p>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>

    <footer class="border-t border-glass-border bg-black/80 py-8 mt-auto">
        <div class="text-center text-gray-500 text-sm">
            <p>&copy; 2024 LIFESTYLEZ. Powered by Groq AI.</p>
        </div>
    </footer>

</body>
</html>
